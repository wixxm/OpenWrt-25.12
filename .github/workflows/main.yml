name: Sync OpenWrt 25.12 to Main

permissions:
  contents: write

concurrency:
  group: sync-openwrt-25.12
  cancel-in-progress: false

on:
  push:
    paths:
      - '.github/workflows/main.yml'
  schedule:
    - cron: 0 */12 * * *  # 每12小时运行一次
  workflow_dispatch:  # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 克隆 OpenWrt 官方仓库的 openwrt-25.12 分支
      - name: Clone OpenWrt Repository
        run: |
          git clone --depth 1 --branch openwrt-25.12 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 2. 克隆目标仓库（你的仓库）
      - name: Clone Your Repository
        env:
          PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone https://x-access-token:${PAT}@github.com/wixxm/OpenWrt-25.12.git target_repo

      # 3. 备份 .github 文件夹和需要保留的文件
      - name: Backup Existing Files
        run: |
          mkdir -p backup/files
          # 备份 .github 文件夹
          if [ -d "target_repo/.github" ]; then
            mv target_repo/.github backup/github_backup
          fi
          # 备份需要保留的文件（文件不存在时跳过，不报错）
          for f in config/Config-images.in package/base-files/files/etc/banner package/base-files/files/bin/config_generate include/version.mk; do
            if [ -f "target_repo/$f" ]; then
              cp "target_repo/$f" backup/files/
            fi
          done

      # 4. 将 OpenWrt 仓库的内容同步到目标仓库
      - name: Sync OpenWrt Changes
        run: |
          rsync -av --delete --exclude='.git' --exclude='.github' openwrt/ target_repo/

      # 5. 恢复备份的文件和文件夹
      - name: Restore Backup Files
        run: |
          # 恢复 .github 文件夹
          if [ -d "backup/github_backup" ]; then
            mv backup/github_backup target_repo/.github
          fi
          # 恢复其他文件（备份里有的才恢复）
          [ -f backup/files/Config-images.in ] && cp backup/files/Config-images.in target_repo/config/
          [ -f backup/files/banner ] && cp backup/files/banner target_repo/package/base-files/files/etc/
          [ -f backup/files/config_generate ] && cp backup/files/config_generate target_repo/package/base-files/files/bin/
          [ -f backup/files/version.mk ] && cp backup/files/version.mk target_repo/include/

      # 6. 显式配置 Git 用户信息并提交更改
      - name: Commit and Push Changes
        env:
          PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd target_repo
          # 配置 Git 用户信息
          git config user.name "wixxm"
          git config user.email "94870224+wixxm@users.noreply.github.com"

          # 设置时区为上海
          export TZ="Asia/Shanghai"

          # 获取当前日期和时间
          timestamp=$(date +"%Y-%m-%d %H:%M:%S")

          # 提交并推送更改（无更改时不提交、不推送）
          git add .
          if git diff --cached --quiet; then
            echo "没有新的更改可提交"
          else
            git commit -m "🏅 Sync OpenWrt-25.12 - $timestamp"
            git push origin HEAD:main
          fi
